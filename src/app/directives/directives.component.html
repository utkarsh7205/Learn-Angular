       NG FOR

<ul>

              {{i}}

              <h1 *ngFor="let j of i"> {{j}}</h1>
       </li>
</ul>

<div *ngIf="block == 0">
       <h1>Hii</h1>
</div>
<div *ngIf="block == 1">
       <h1>Byy</h1>
</div>
<div *ngIf="block == 2">
       <h1>Hello</h1>
</div>
<div *ngIf="block == 3; else elseBlock">
       <h1>snDNc s</h1>
</div>
<ng-template #elseBlock>
       <h1>Fuck Off</h1>
</ng-template>

<button (click)="updateBlock()">Click</button>

<hr>

<button (click)="updateColor('red')">Red</button>
<button (click)="updateColor('green')">Green</button>
<button (click)="updateColor('yellow')">Yellow</button>
<button (click)="updateColor('Blue')">Blue</button>
<button (click)="updateColor('black')">Ass</button>

<div [ngSwitch]="color">
       <h1 *ngSwitchCase="'red'" style="background-color: red;">Red Color</h1>
       <h1 *ngSwitchCase="'green'" style="background-color: green;">Green Color</h1>
       <h1 *ngSwitchCase="'yellow'" style="background-color: yellow;">Yellow Color</h1>
       <h1 *ngSwitchCase="'Blue'" style="background-color: blue;">Blue Color</h1>
       <h1 *ngSwitchDefault style="background-color: black; color: white;">Ass</h1>
</div>
